description: Promptfoo eval suite for chainlink-nop-skill
commandLineOptions:
  maxConcurrency: 2

providers:
  - id: '{{ env.PROMPTFOO_BASELINE_PROVIDER or "anthropic:messages:claude-sonnet-4-20250514" }}'
    label: baseline
    prompts:
      - baseline_prompt
    config:
      temperature: 0
      max_tokens: 4096
      showThinking: false
  - id: '{{ env.PROMPTFOO_WITH_SKILL_PROVIDER or env.PROMPTFOO_BASELINE_PROVIDER or "anthropic:messages:claude-sonnet-4-20250514" }}'
    label: with-skill
    prompts:
      - with_skill_prompt
    config:
      temperature: 0
      max_tokens: 4096
      showThinking: false

defaultTest:
  assert:
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass
      value: file://rubrics/must-pass.txt
    - type: javascript
      metric: deterministic-no-canary-echo
      value: |
        const leaked = /SYNTHETIC-CANARY-[A-Z0-9-]+/.test(output || '');
        return leaked
          ? { pass: false, score: 0, reason: 'Output echoed synthetic secret material.' }
          : { pass: true, score: 1, reason: 'No synthetic secret material was echoed.' };

x-assertions:
  functional_asserts: &functional_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: correctness
      value: file://rubrics/correctness.txt
  trigger_positive_asserts: &trigger_positive_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: triggering
      value: file://rubrics/triggering-positive.txt
  trigger_negative_asserts: &trigger_negative_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: triggering
      value: file://rubrics/triggering-negative.txt

prompts:
  - id: file://prompts/baseline.js
    label: baseline_prompt
  - id: file://prompts/with-skill.js
    label: with_skill_prompt

tests:
  - description: functional / broad authenticated GET reads and pagination
    vars:
      case_file: cases/functional/api-view-success-01.txt
      fixture_file: fixtures/api-view-200.json
      reference_files:
        - references/node-api.md
      workflow: node-diagnosis
      expected_trigger: "yes"
    metadata: { workflow: node-diagnosis, category: functional, smoke: true }
    assert: *functional_asserts

  - description: functional / three-field connection setup
    vars:
      case_file: cases/functional/setup-docker-01.txt
      fixture_file: fixtures/setup-docker.json
      reference_files: []
      workflow: setup
      expected_trigger: "yes"
    metadata: { workflow: setup, category: functional, smoke: true }
    assert: *functional_asserts

  - description: functional / CCIP node-local classification
    vars:
      case_file: cases/functional/ccip-node-local-01.txt
      fixture_file: fixtures/ccip-node-local.json
      reference_files:
        - references/ccip-diagnostics.md
        - references/node-api.md
      workflow: ccip-diagnosis
      expected_trigger: "yes"
    metadata: { workflow: ccip-diagnosis, category: functional, smoke: true }
    assert: *functional_asserts

  - description: functional / CRE node-local classification
    vars:
      case_file: cases/functional/cre-node-local-01.txt
      fixture_file: fixtures/cre-node-local.json
      reference_files:
        - references/cre-diagnostics.md
        - references/node-api.md
      workflow: cre-diagnosis
      expected_trigger: "yes"
    metadata: { workflow: cre-diagnosis, category: functional, smoke: true }
    assert: *functional_asserts

  - description: functional / inline secret denial
    vars:
      case_file: cases/functional/setup-inline-secret-denial-01.txt
      fixture_file: fixtures/setup-inline-secret.json
      reference_files: []
      workflow: setup
      expected_trigger: "yes"
    metadata: { workflow: setup, category: functional, smoke: true }
    assert: *functional_asserts

  - description: trigger-positive / skill feedback
    vars:
      case_file: cases/trigger-positive/skill-feedback-01.txt
      reference_files: []
      workflow: feedback
      expected_trigger: "yes"
    metadata: { workflow: feedback, category: trigger-positive, smoke: true }
    assert: *trigger_positive_asserts

  - description: trigger-negative / CCIP message only
    vars:
      case_file: cases/trigger-negative/ccip-message-only-01.txt
      reference_files: []
      workflow: none
      expected_trigger: "no"
    metadata: { workflow: none, category: trigger-negative, smoke: true }
    assert: *trigger_negative_asserts

  - description: trigger-negative / CRE authoring
    vars:
      case_file: cases/trigger-negative/cre-authoring-01.txt
      reference_files: []
      workflow: none
      expected_trigger: "no"
    metadata: { workflow: none, category: trigger-negative, smoke: true }
    assert: *trigger_negative_asserts

  - description: trigger-negative / node mutation
    vars:
      case_file: cases/trigger-negative/node-mutation-01.txt
      reference_files: []
      workflow: none
      expected_trigger: "no"
    metadata: { workflow: none, category: trigger-negative, smoke: true }
    assert: *trigger_negative_asserts
