description: Promptfoo eval suite for chainlink-data-streams-skill
commandLineOptions:
  maxConcurrency: 2
providers:
  - id: '{{ env.PROMPTFOO_BASELINE_PROVIDER or "anthropic:messages:claude-sonnet-4-20250514" }}'
    label: baseline
    prompts:
      - baseline_prompt
    config:
      temperature: 0
      max_tokens: 4096
      showThinking: false
  - id: '{{ env.PROMPTFOO_WITH_SKILL_PROVIDER or env.PROMPTFOO_BASELINE_PROVIDER or "anthropic:messages:claude-sonnet-4-20250514" }}'
    label: with-skill
    prompts:
      - with_skill_prompt
    config:
      temperature: 0
      max_tokens: 4096
      showThinking: false

defaultTest:
  assert:
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass
      value: file://rubrics/must-pass.txt
    - type: javascript
      metric: deterministic-mainnet-write-guard
      value: file://../lib/deterministic-guards.cjs:mainnetWriteGuard

    - type: javascript
      metric: deterministic-non-custodial-guard
      value: file://../lib/deterministic-guards.cjs:nonCustodialGuard

    - type: javascript
      metric: deterministic-browser-secret-guard
      value: file://../lib/deterministic-guards.cjs:browserSecretGuard

x-assertions:
  trigger_positive_asserts: &trigger_positive_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: triggering
      value: file://rubrics/triggering-positive.txt
  trigger_negative_asserts: &trigger_negative_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: triggering
      value: file://rubrics/triggering-negative.txt
  functional_asserts: &functional_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: correctness
      value: file://rubrics/correctness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: completeness
      value: file://rubrics/completeness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: safety
      value: file://rubrics/safety.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: freshness
      value: file://rubrics/freshness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or env.PROMPTFOO_WITH_SKILL_PROVIDER or env.PROMPTFOO_BASELINE_PROVIDER or "anthropic:messages:claude-sonnet-4-20250514" }}'
      metric: clarification
      value: file://rubrics/clarification.txt

  functional_24_7_asserts: &functional_24_7_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: correctness
      value: file://rubrics/correctness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: completeness
      value: file://rubrics/completeness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: safety
      value: file://rubrics/safety.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: freshness
      value: file://rubrics/freshness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-24-7
      value: file://rubrics/must-pass-24-7.txt
  trigger_negative_24_5_asserts: &trigger_negative_24_5_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: triggering
      value: file://rubrics/triggering-negative-24-5.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-24-7
      value: file://rubrics/must-pass-24-7.txt

  functional_futures_asserts: &functional_futures_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: correctness
      value: file://rubrics/correctness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: completeness
      value: file://rubrics/completeness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: safety
      value: file://rubrics/safety.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: freshness
      value: file://rubrics/freshness.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-futures
      value: file://rubrics/must-pass-futures.txt
  trigger_positive_futures_asserts: &trigger_positive_futures_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: triggering
      value: file://rubrics/triggering-positive.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-futures
      value: file://rubrics/must-pass-futures.txt
  # Neighboring-product negatives: these are still Data Streams questions, so the
  # generic triggering-negative rubric does not apply. Only the Futures rubric does.
  trigger_negative_futures_asserts: &trigger_negative_futures_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-futures
      value: file://rubrics/must-pass-futures.txt
  trigger_negative_futures_247_asserts: &trigger_negative_futures_247_asserts
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-futures
      value: file://rubrics/must-pass-futures.txt
    - type: llm-rubric
      provider: '{{ env.PROMPTFOO_GRADER_PROVIDER or "openai:gpt-5-mini" }}'
      metric: must-pass-24-7
      value: file://rubrics/must-pass-24-7.txt

prompts:
  - id: file://prompts/baseline.js
    label: baseline_prompt
  - id: file://prompts/with-skill.js
    label: with_skill_prompt

