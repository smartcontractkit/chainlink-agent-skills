name: URL Check

# The job fails when check-urls.sh reports a broken URL.
# HTTP 401, 403, 405, and 429 stay warnings: the host answered.
# To block a merge, the repository rules must require this check.

on:
  pull_request:
    branches: [main]
    paths:
      - '*-skill/**'
      - '.github/workflows/url-check.yml'
      - '.github/scripts/check-urls.sh'
      - '.github/url-check-endpoints.txt'
      - '.github/url-check-allowlist.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check URLs in skill docs
        id: urlcheck
        run: bash .github/scripts/check-urls.sh | tee "$RUNNER_TEMP/url-report.txt"

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo '## URL check'
            if [ "${{ steps.urlcheck.outcome }}" = "success" ]; then
              echo 'All checked URLs are reachable.'
            else
              echo 'Broken URLs found. This check failed.'
            fi
            echo
            echo '```'
            grep -v '^::' "$RUNNER_TEMP/url-report.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
